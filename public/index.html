<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Page -->
    <div id="auth-container">
        <div class="auth-card">
            <h1>Admin Login</h1>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="axmedov">
                </div>
                <button type="submit">Log In</button>
                <p id="login-error" class="error-msg">Invalid username or password</p>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-container">
        <nav>
            <div class="nav-link active" data-section="all">All Clients</div>
            <div class="nav-link" data-section="bday-7">Birthday in 7 days</div>
            <div class="nav-link" data-section="bday-3">Birthday in 3 days</div>
            <div class="nav-link" data-section="bday-0">Birthday Today</div>
            <div class="nav-link" data-section="add">Add New Client</div>
            <div class="nav-link" data-section="telegram">Telegram Registration</div>
            <div class="nav-spacer"></div>
            <button class="logout-btn" id="logout-btn">Logout</button>
        </nav>

        <main id="content-area">
            <!-- Dynamic content injected here -->
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
